<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- ========================
         CUSTOM CURSOR
    ========================= -->

    <div class="cursor"></div>



    <!-- ========================
         LOADER
    ========================= -->

    <div class="loader">

        <div class="loader-content">

            <h1 class="loader-logo">
                PORTFOLIO
            </h1>


            <div class="loader-bottom">

                <div class="loader-info">

                    <span>LOADING</span>

                    <span class="loader-percent">
                        0%
                    </span>

                </div>


                <div class="loader-line">

                    <div class="loader-line-progress"></div>

                </div>

            </div>

        </div>

    </div>



    <!-- ========================
         HERO
    ========================= -->

    <main class="hero">


        <div class="hero-top">

            <span>
                PORTFOLIO / 2026
            </span>

            <span>
                WEB DEVELOPER
            </span>

        </div>



        <div class="hero-title">

            <div class="hero-title-mask">

                <h1>
                    YOUR NAME
                </h1>

            </div>

        </div>



        <div class="hero-bottom">

            <span>
                SCROLL TO EXPLORE
            </span>

            <span>
                ↓
            </span>

        </div>


    </main>



    <!-- ========================
         PROJECTS
    ========================= -->

    <section
        class="projects"
        id="projects"
    >


        <!-- HEADER -->

        <div class="projects-header">

            <h2>
                SELECTED PROJECTS
            </h2>

            <span>
                (01 — 03)
            </span>

        </div>



        <!-- PROJECT GRID -->

        <div class="projects-grid">


            <!-- ========================
                 PROJECT 01
            ========================= -->

            <article class="project-card">


                <div class="project-meta">

                    <span>
                        01
                    </span>

                    <span>
                        2026
                    </span>

                </div>



                <div class="project-image">

                    <img
                        src="assets/images/project-1.jpg"
                        alt="Project One"
                    >

                </div>



                <div class="project-card-bottom">


                    <div class="project-text">

                        <h3>
                            PROJECT ONE
                        </h3>

                        <p>
                            WEB DESIGN / DEVELOPMENT
                        </p>

                    </div>


                    <span class="project-card-arrow">
                        ↗
                    </span>


                </div>


            </article>



            <!-- ========================
                 PROJECT 02
            ========================= -->

            <article class="project-card">


                <div class="project-meta">

                    <span>
                        02
                    </span>

                    <span>
                        2026
                    </span>

                </div>



                <div class="project-image">

                    <img
                        src="assets/images/project-2.jpg"
                        alt="Project Two"
                    >

                </div>



                <div class="project-card-bottom">


                    <div class="project-text">

                        <h3>
                            PROJECT TWO
                        </h3>

                        <p>
                            FRONTEND / UI
                        </p>

                    </div>


                    <span class="project-card-arrow">
                        ↗
                    </span>


                </div>


            </article>



            <!-- ========================
                 PROJECT 03
            ========================= -->

            <article class="project-card">


                <div class="project-meta">

                    <span>
                        03
                    </span>

                    <span>
                        2026
                    </span>

                </div>



                <div class="project-image">

                    <img
                        src="assets/images/project-3.jpg"
                        alt="Project Three"
                    >

                </div>



                <div class="project-card-bottom">


                    <div class="project-text">

                        <h3>
                            PROJECT THREE
                        </h3>

                        <p>
                            WEBSITE / DEVELOPMENT
                        </p>

                    </div>


                    <span class="project-card-arrow">
                        ↗
                    </span>


                </div>


            </article>


        </div>


    </section>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
